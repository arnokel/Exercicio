<button id="meuBotao">Clique Aqui</button>
<script>
document.getElementById("meuBotao").addEventListener("click", () => {
alert("Botão pressionado!");
});
</script>

<p id="texto">Texto</p>
<button id="btn">Mudar</button>
<script>
document.getElementById("btn").addEventListener("click", () => {
document.getElementById("texto").innerText = "Texto Atualizado!";
});
</script>

<input type="text" id="campoNome">
<button id="btnPegar">Exibir</button>
<script>
document.getElementById("btnPegar").addEventListener("click", () => {
let nomeDigitado = document.getElementById("campoNome").value;
alert(nomeDigitado);
});
</script>

<div id="bloco" style="width:100px; height:100px; background:blue;"></div>
<script>
document.getElementById("bloco").addEventListener("mouseenter", (e) => {
e.target.style.backgroundColor = "red";
});
</script>

<input type="text" id="campoFoco">
<script>
let input = document.getElementById("campoFoco");
input.addEventListener("focus", () => input.style.borderColor = "yellow");
input.addEventListener("blur", () => input.style.borderColor = "gray");
</script>

<textarea id="mensagem"></textarea>
<span id="contador">0</span>
<script>
document.getElementById("mensagem").addEventListener("keyup", (e) => {
document.getElementById("contador").innerText = e.target.value.length;
});
</script>

<ul id="listaDeTarefas"></ul>
<button id="btnAdd">Novo Item</button>
<script>
document.getElementById("btnAdd").addEventListener("click", () => {
let novoLi = document.createElement("li");
novoLi.innerText = "Nova tarefa agendada";
document.getElementById("listaDeTarefas").appendChild(novoLi);
});
</script>

<button id="btnTema">Alternar Tema</button>
<script>
const botao = document.getElementById("btnTema")

botao.addEventListener("click", function() {
    document.body.classList.toggle("modo-escuro")
});
</script>

<form id="meuForm">
<button type="submit">Enviar</button>
</form>
<script>
document.getElementById("meuForm").addEventListener("submit", function(event) {
event.preventDefault();
alert("Envio interceptado com sucesso.");
});
</script>

<ul id="grupoItens">
<li>Item Alfa</li>
<li>Item Beta</li>
</ul>
<script>
document.getElementById("grupoItens").addEventListener("click", (e) => {
alert("Você clicou no: " + e.target.innerText);
});
</script>

</body>
